apiVersion: v1
kind: Namespace
metadata:
  name: obs-mcp
  labels:
    kubernetes.io/metadata.name: obs-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obs-mcp
  namespace: obs-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obs-mcp
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["tempo.grafana.com"]
    resources: ["tempostacks", "tempomonolithics"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obs-mcp
subjects:
  - kind: ServiceAccount
    name: obs-mcp
    namespace: obs-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obs-mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-mcp-config
  namespace: obs-mcp
data:
  prometheus-url: "http://prometheus.otel-demo.svc.cluster.local:9090"
  alertmanager-url: "http://alertmanager-main.monitoring.svc.cluster.local:9093"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-mcp
  namespace: obs-mcp
  labels:
    app.kubernetes.io/name: obs-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obs-mcp
    spec:
      serviceAccountName: obs-mcp
      automountServiceAccountToken: true
      containers:
        - name: obs-mcp
          image: quay.io/agerstmayr/obs-mcp:5d2dacf
          imagePullPolicy: IfNotPresent
          args:
            - --listen
            - ":9100"
            - --auth-mode
            - header
            - --insecure
            - --log-level
            - debug
            - --toolsets
            - metrics,traces
          env:
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: obs-mcp-config
                  key: prometheus-url
            - name: ALERTMANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: obs-mcp-config
                  key: alertmanager-url
          ports:
            - containerPort: 9100
              name: mcp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: obs-mcp
  namespace: obs-mcp
  labels:
    app.kubernetes.io/name: obs-mcp
spec:
  ports:
    - name: mcp
      port: 9100
      targetPort: mcp
  selector:
    app.kubernetes.io/name: obs-mcp
